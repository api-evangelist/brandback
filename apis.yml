aid: brandback
name: Brandback
description: >-
  Brandback is a Berlin-based embedded resale infrastructure company (legal
  entity Arbor Technologies GmbH) that lets online retailers and fashion brands
  integrate resale directly into their baskets, product listings, and checkouts.
  Shoppers see an item's future resale value before they buy, resell it later in
  a single click, and receive store credit, while Brandback's AI handles pricing
  recommendations, condition checks, customer service, shipping, disputes, and
  payouts. Retailers can launch a white-label resale marketplace with no upfront
  cost and integrate with any e-commerce platform. Founded in 2023 and backed by
  $7.4M in pre-seed and seed funding led by Earlybird VC, Brandback reports a
  9.5% average conversion-rate lift with customers including Replay Jeans and
  Sandqvist.
